<!DOCTYPE html>
<html>
<body>
    <h3>Danh sách các đơn vị:</h3>
    <div id="demo"></div>
    <script>
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (xhttp.readyState == 4 && xhttp.status == 200) {
                myFunction(xhttp);
            }
        };
        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();
        function myFunction(xml) {
            var xmlDoc = xml.responseXML;
            var x = xmlDoc.getElementsByTagName("nhanvien");
            var dsDonVi = [];
            var txt = "<ul>";
            for (var i = 0; i < x.length; i++) {
                var donvi = x[i].getElementsByTagName("donvi")[0].childNodes[0].nodeValue;
                if (dsDonVi.indexOf(donvi) === -1) {
                    dsDonVi.push(donvi);
                    txt += "<li>" + donvi + "</li>";
                }
            }
            txt += "</ul>";
            document.getElementById("demo").innerHTML = txt;
        }
    </script>
</body>
</html>
