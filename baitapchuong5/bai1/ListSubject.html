<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ListSubject</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 6px 12px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div id="result"></div>

    <script>
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var xmlDoc = xhr.responseXML;
                var subjects = xmlDoc.getElementsByTagName("subject");

                var output = "<table>";
                output += "<tr><th>STT</th><th>Tên môn học</th><th>Nhà xuất bản</th><th>Tác giả</th></tr>";

                for (var i = 0; i < subjects.length; i++) {
                    var title = subjects[i].getElementsByTagName("title")[0].firstChild.nodeValue;
                    var publisher = subjects[i].getElementsByTagName("publisher")[0].firstChild.nodeValue;
                    var author = subjects[i].getElementsByTagName("author")[0].firstChild.nodeValue;

                    output += "<tr>";
                    output += "<td align='center'>" + (i + 1) + "</td>";
                    output += "<td>" + title + "</td>";
                    output += "<td>" + publisher + "</td>";
                    output += "<td>" + author + "</td>";
                    output += "</tr>";
                }

                output += "</table>";
                document.getElementById("result").innerHTML = output;
            }
        };
        xhr.open("GET", "dsmonhoc.xml", true);
        xhr.send();
    </script>
</body>
</html>
