<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Capnhatgiangvien</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 6px 12px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div id="result"></div>
    <script>
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                var xmlDoc = xhr.responseXML;
                var gvs = xmlDoc.getElementsByTagName("giangvien");

                // Tìm giảng viên "Phạm Thanh Loan" và cập nhật nodeValue của donvi thành "Cơ bản"
                for (var i = 0; i < gvs.length; i++) {
                    var hoten = gvs[i].getElementsByTagName("hoten")[0].firstChild.nodeValue;
                    if (hoten.trim() === "Phạm Thanh Loan") {
                        gvs[i].getElementsByTagName("donvi")[0].firstChild.nodeValue = "Cơ bản";
                    }
                }
                var output = "<table>";
                output += "<tr><th>STT</th><th>Họ tên giảng viên</th><th>Ngành</th><th>Đơn vị</th></tr>";
                for (var i = 0; i < gvs.length; i++) {
                    var hoten = gvs[i].getElementsByTagName("hoten")[0].firstChild.nodeValue;
                    var nganh = gvs[i].getElementsByTagName("nganh")[0].firstChild.nodeValue;
                    var donvi = gvs[i].getElementsByTagName("donvi")[0].firstChild.nodeValue;
                    output += "<tr>";
                    output += "<td align='center'>" + (i + 1) + "</td>";
                    output += "<td>" + hoten + "</td>";
                    output += "<td>" + nganh + "</td>";
                    output += "<td>" + donvi + "</td>";
                    output += "</tr>";
                }
                output += "</table>";
                document.getElementById("result").innerHTML = output;
            }
        };
        xhr.open("GET", "hosogiangvien.xml", true);
        xhr.send();
    </script>
</body>
</html>
