<!DOCTYPE html>
<html>
<body>
    <p id="demo"></p>
    <script>
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (xhttp.readyState == 4 && xhttp.status == 200) {
                myFunction(xhttp);
            }
        };
        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();
        function myFunction(xml) {
            var xmlDoc = xml.responseXML;
            var x = xmlDoc.getElementsByTagName("nhanvien");
            var tongLuong = 0;
            for (var i = 0; i < x.length; i++) {
                var luongText = x[i].getElementsByTagName("luong")[0].childNodes[0].nodeValue;
                var luongSo = parseInt(luongText.split('.').join(''), 10);
                tongLuong += luongSo;
            }
            document.getElementById("demo").innerHTML = 
                "Tổng lương của tất cả nhân viên: " + tongLuong.toLocaleString("vi-VN") + " VNĐ";
        }
    </script>
</body>
</html>
